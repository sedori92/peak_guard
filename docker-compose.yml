# 피크가드 실행 설정 — 이 파일이 있는 폴더에서: docker compose up -d --build
#   data/    ← 기업 전력 CSV(data/raw), 기상 CSV(data/weather), 새 자료(data/incoming)
#   state/   ← DB 파일 (peakguard.db, 입주자 연락처 포함 — 외부 공유 금지)
#   models/  ← 학습된 모델 파일
#   reports/ ← 보고서·시연 파일
services:
  peakguard:
    build: .
    image: peakguard:latest
    container_name: peakguard
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      - ./models:/app/models
      - ./reports:/app/reports
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
